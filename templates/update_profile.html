{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Update Profile | E-Shop</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        min-height: 100vh;
    }

    .navbar {
        height: 70px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        border-bottom: 1px solid #eee;
    }

    .logo {
        font-size: 23px;
        font-weight: bold;
        color: #222;
        text-decoration: none;
    }

    .nav-links {
        display: flex;
        gap: 25px;
    }

    .nav-links a {
        text-decoration: none;
        color: #555;
        font-weight: 600;
    }

    .container {
        max-width: 700px;
        margin: 50px auto;
        padding: 0 20px;
    }

    .profile-card {
        background: white;
        border-radius: 18px;
        padding: 35px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.06);
    }

    .profile-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: #f3e8ff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 35px;
        margin: 0 auto 15px;
    }

    .profile-header h1 {
        font-size: 25px;
        margin-bottom: 5px;
    }

    .profile-header p {
        color: #777;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 700;
        color: #333;
    }

    .form-group input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 9px;
        font-size: 14px;
        outline: none;
    }

    .form-group input:focus {
        border-color: #6d28d9;
    }

    .buttons {
        display: flex;
        gap: 12px;
        margin-top: 25px;
    }

    .save-btn {
        flex: 1;
        border: none;
        background: #6d28d9;
        color: white;
        padding: 14px;
        border-radius: 9px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
    }

    .back-btn {
        flex: 1;
        background: #f1f1f1;
        color: #333;
        padding: 14px;
        border-radius: 9px;
        text-align: center;
        font-weight: 700;
        text-decoration: none;
    }

    @media(max-width:600px) {

        .navbar {
            padding: 0 18px;
        }

        .nav-links {
            display: none;
        }

        .profile-card {
            padding: 25px 20px;
        }

        .buttons {
            flex-direction: column;
        }

    }

</style>
```

</head>

<body>

<header class="navbar">

```
<a href="{% url 'home' %}" class="logo">
    🛒 E-Shop
</a>

<div class="nav-links">

    <a href="{% url 'dashboard' %}">
        Dashboard
    </a>

    <a href="{% url 'orders' %}">
        Orders
    </a>

    <a href="{% url 'cart' %}">
        Cart
    </a>

</div>
```

</header>

<div class="container">

```
<div class="profile-card">


    <div class="profile-header">

        <div class="avatar">
            👤
        </div>

        <h1>
            Update Profile
        </h1>

        <p>
            Manage your E-Shop account information
        </p>

    </div>


    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>
                Username
            </label>

            <input
                type="text"
                value="{{ user.username }}"
                disabled
            >

        </div>


        <div class="form-group">

            <label>
                First Name
            </label>

            <input
                type="text"
                name="first_name"
                value="{{ user.first_name }}"
                placeholder="Enter your first name"
            >

        </div>


        <div class="form-group">

            <label>
                Last Name
            </label>

            <input
                type="text"
                name="last_name"
                value="{{ user.last_name }}"
                placeholder="Enter your last name"
            >

        </div>


        <div class="form-group">

            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                value="{{ user.email }}"
                placeholder="Enter your email"
            >

        </div>


        <div class="buttons">

            <a href="{% url 'dashboard' %}"
               class="back-btn">

                Cancel

            </a>

            <button type="submit"
                    class="save-btn">

                Save Changes

            </button>

        </div>


    </form>

</div>
```

</div>

</body>
</html>
